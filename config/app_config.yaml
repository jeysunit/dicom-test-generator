# 装置のプロファイルの置き場（docs/spec/13_device_profiles.md の 6）。
# 実在の装置のプロファイルはリポジトリの外に置き、ここか環境の変数
# DTG_PROFILE_DIRS で指す。相対のパスはこのファイルの場所から。
profiles:
  search_paths: []

# モダリティのダミー（docs/spec/12_modality_emulator.md の 12 章）。
# 例は手元の住所と例の名前だけ。試験用の PACS・RIS にだけつなぐ。
modality:
  # 名乗る装置の一覧（AEタイトル・Station Name）。画面の情報バーで切り替える。
  # 相手の PACS・RIS に、使う装置の AEタイトルを登録しておく。
  # 1台だけなら、stations の代わりに ae_title・station_name だけを書いてもよい。
  stations:
    - name: "CT1"
      ae_title: "DTG_CT01"
      station_name: "DTG_CT01"
    - name: "MR1"
      ae_title: "DTG_MR01"
      station_name: "DTG_MR01"
  default_station: "CT1"
  listen:                         # 保管の確認の結果を受ける待ち受け（Phase 3c）
    bind_address: "127.0.0.1"
    port: 11113
  state_dir: "modality_state"     # 予約の最後の結果・待ち行列（sqlite3）
  output_dir: "output/modality"
  character_set: "auto"           # auto, utf8, jis, jis_kana
  character_set_fallback: "utf8"  # utf8, jis, jis_kana（auto は不可）
  default_template: "ct_generic"
  default_profile: null           # 装置のプロファイル（docs/spec/13）。null は重ねない
  default_hospital: null
  default_pixel_mode: "ct_realistic"  # simple_text, ct_realistic
  worklist:
    ae_title: "RIS_TEST"
    host: "127.0.0.1"
    port: 4242
    timeout_seconds: 30
    query_character_set: "ISO_IR 192"  # 条件に ASCII でない字があるとき
    max_results: 1000             # 応答の上限（docs/spec/12 の 5.5）
    max_item_bytes: 262144
    max_total_bytes: 16777216
    use_mpps: false               # MPPS を送るか（docs/spec/12 の 8.4.1）
  mpps: null                      # MPPS の送信先。null はワークリストの相手（docs/spec/12 の 12 章）
  destinations:
    - name: "PACS_TEST"
      ae_title: "PACS_TEST"
      host: "127.0.0.1"
      port: 4242
      storage_commitment: false
      commitment_timeout_seconds: 600  # 保管の確認の結果を待つ秒（docs/spec/12 の 8.3）
      commitment_wait_seconds: 0  # 同じ Association で結果を待つ秒。0 は待たない（8.3.1）
      timeout_seconds: 30
  default_destination: "PACS_TEST"
  retry:
    max_attempts: 0               # 0 = 自動で再送信しない
  max_images_per_exam: 2000       # 1回の撮影の合計の枚数の上限（docs/spec/12a の 10.5）
  # 撮影済みの予約の撮り直し（docs/spec/12 の 6.3）。append：同じ予約で追加撮影（同じ
  # Study に新しいシリーズ）。new_order：RIS で作った新しい予約で撮り直す
  retake_mode: "append"

# ウェブの画面（docs/spec/12a_web_screens_and_cli.md の 10.9、docs/spec/12_modality_emulator.md の 12 章）。既定は手元だけ。
# 手元の外で待ち受けるときは、環境の変数 DTG_WEB_PASSWORD_FILE でパスワードの
# ファイルを指す（無ければ起動しない）。パスワードをここに書かない。
web:
  bind_address: "127.0.0.1"
  port: 8080

