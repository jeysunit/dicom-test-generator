{# 接続確認の応答：押した行の「最後の接続確認」を差し替え、区画の上の知らせ（#echo-notice）と上の帯を同梱して差し替える #}
{% include "_echo_cell.html" %}
<div id="echo-notice" hx-swap-oob="true">
  {% if notice.ok %}
  <div role="status" class="notice" data-k="ok"><svg class="ic" aria-hidden="true"><use href="/static/ui-kit/icons.svg#i-check"/></svg><span>{{ notice.text }}</span></div>
  {% else %}
  <div role="alert" class="notice" data-k="err"><svg class="ic" aria-hidden="true"><use href="/static/ui-kit/icons.svg#i-alert"/></svg><span>{{ notice.text }}</span></div>
  {% endif %}
</div>
{% if oob_band %}{% include "_band.html" %}{% endif %}
