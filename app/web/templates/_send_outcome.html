{% include "_send_result.html" %}
{# 同じ画像を何回でも送り直せる。画像は作り直さない（docs/spec/12a の 10.5） #}
<form hx-post="/exam/send" hx-target="#send-result" hx-disabled-elt="find button" class="mt-2 flex justify-end">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="output_dir" value="{{ output_dir }}">
  <p class="busy busy-send mr-auto" role="status"><span class="icon icon-refresh-cw animate-spin" aria-hidden="true"></span>送信しています</p>
  <button type="submit" class="btn btn-outline"><span class="icon icon-send" aria-hidden="true"></span>もう一度送る</button>
</form>
