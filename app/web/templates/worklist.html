{% extends "base.html" %}
{% block title %}ワークリスト{% endblock %}
{% block content %}
<div class="pagehead"><h1>ワークリスト</h1></div>
{% if load_error %}
{% with error = load_error %}{% include "_notice.html" %}{% endwith %}
{% endif %}
<form id="query-form" hx-post="/worklist/query" hx-target="#results" hx-disabled-elt="find button" class="searchband" aria-label="条件">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="field">
    <span class="field-label">予定の日</span>
    <select name="day" class="input w-36">
      {% for value, label in day_choices %}
      <option value="{{ value }}"{% if value == "today" %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="field">
    <span class="field-label">日付（日付を指定のとき）</span>
    <input type="date" name="date" class="input w-44">
  </label>
  <label class="field">
    <span class="field-label">モダリティ（空で絞らない）</span>
    <input type="text" name="modality" value="{{ default_modality }}" class="input w-44" maxlength="16">
  </label>
  <label class="field">
    <span class="field-label">装置の AEタイトル</span>
    <select name="station" class="input w-64">
      <option value="own" selected>この装置で絞る（{{ band.own_ae }}）</option>
      <option value="any">絞らない</option>
    </select>
  </label>
  <label class="field">
    <span class="field-label">患者ID</span>
    <input type="text" name="patient_id" class="input w-40" maxlength="64">
  </label>
  <label class="field">
    <span class="field-label">氏名</span>
    <input type="text" name="patient_name" class="input w-40" maxlength="64">
  </label>
  <label class="field">
    <span class="field-label">受付番号</span>
    <input type="text" name="accession" class="input w-40" maxlength="16">
  </label>
  <button type="submit" class="btn btn-outline">
    <span class="icon icon-search" aria-hidden="true"></span>ワークリスト検索
  </button>
</form>
<section id="results" aria-live="polite">
  {% if results %}{% include "_worklist_results.html" %}{% endif %}
</section>
<section id="detail"></section>
{% endblock %}
