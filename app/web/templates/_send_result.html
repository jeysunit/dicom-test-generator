{% set sent_count = send.results|selectattr("sent")|list|length %}
{% set done = send.status == "sent" %}
<div {% if done %}role="status" class="notice notice-ok"{% else %}role="alert" class="notice notice-error"{% endif %}>
  <span class="icon {% if done %}icon-check{% else %}icon-triangle-alert{% endif %}" aria-hidden="true"></span>
  <span>
    <span class="font-semibold">{{ STATUS_LABELS.get(send.status, send.status) }}：{{ send.destination }} へ {{ sent_count }}/{{ send.results|length }} 画像（ジョブ {{ send.job_id }}）</span>
    {% if send.error %}<span class="block text-xs">{{ send.error }}</span>{% endif %}
  </span>
</div>
