<span class="inline-flex items-center gap-1">
  <span class="uid">{{ uid or "—" }}</span>
  {% if uid %}
  <button type="button" class="btn-icon" data-copy="{{ uid }}" aria-label="コピー" title="コピー">
    <svg class="ic" aria-hidden="true"><use href="/static/ui-kit/icons.svg#i-copy"/></svg>
  </button>
  {% endif %}
</span>
