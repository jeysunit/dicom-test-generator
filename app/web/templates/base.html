<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
  <title>{% block title %}{% endblock %} - dicom-test-generator</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="flex min-h-screen flex-col bg-background text-foreground" hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  {# 外枠は、上の帯（製品名・表示）と情報バー、その下の左のナビと本文（docs/design-system の menu.md・spec 10.3） #}
  <header class="border-b border-border bg-surface">
    <div class="flex h-12 items-center gap-4 px-4">
      <a href="/worklist" class="font-semibold text-value">dicom-test-generator</a>
      <button id="theme-toggle" type="button" class="btn btn-ghost ml-auto" aria-label="明るい地と暗い地を切り替える" title="明るい地と暗い地を切り替える">
        <span class="icon icon-sun show-light" aria-hidden="true"></span>
        <span class="icon icon-moon show-dark" aria-hidden="true"></span>
      </button>
    </div>
    {% include "_band.html" %}
  </header>
  <div class="shell">
    <nav class="sidenav" aria-label="ページ">
      {% for group, items in nav_groups %}
      <p class="nav-group">{{ group }}</p>
      {% for key, href, label in items %}
      <a href="{{ href }}" class="nav-item"{% if key == page %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
      {% endfor %}
    </nav>
    <main class="min-w-0 max-w-6xl space-y-3 px-4 py-3 md:px-6">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
