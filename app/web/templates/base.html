<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true}'>
  <title>{% block title %}{% endblock %} - dicom-test-generator</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="min-h-screen bg-background text-foreground" hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <header class="border-b border-border bg-surface">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-2">
      <a href="/worklist" class="font-semibold text-value">dicom-test-generator</a>
      <nav class="flex flex-wrap gap-1" aria-label="頁">
        {% for key, href, label in pages %}
        <a href="{{ href }}" class="nav-link{% if key == page %} nav-active{% endif %}"{% if key == page %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
      <button id="theme-toggle" type="button" class="btn btn-ghost ml-auto" aria-label="明るい地と暗い地を切り替える" title="明るい地と暗い地を切り替える">
        <span class="icon icon-sun show-light" aria-hidden="true"></span>
        <span class="icon icon-moon show-dark" aria-hidden="true"></span>
      </button>
    </div>
    {% include "_band.html" %}
  </header>
  <main class="mx-auto max-w-6xl space-y-6 px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
