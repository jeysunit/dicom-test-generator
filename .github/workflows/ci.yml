name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        # 設定は .markdownlint-cli2.yaml。版を固定する。
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"

  doc-dates:
    name: ADR last-updated dates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Changed ADRs must carry the commit date
        # 規則は docs/decisions/README.md の「書き方」
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_doc_dates.py "$BASE_SHA..HEAD"

  css:
    name: web CSS is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rebuild the CSS with the pinned Tailwind CSS standalone binary
        # 版と sha256 は scripts/build_css.sh に固定してある（docs/development.md の 5 章）
        run: bash scripts/build_css.sh

      - name: Committed CSS must match the rebuilt CSS
        run: git diff --exit-code -- app/web/static/app.css

  docker:
    name: Docker image builds and starts (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t dicom-test-generator:ci .

      - name: CLI runs as a non-root user
        run: |
          set -eu
          docker run --rm dicom-test-generator:ci python -m app.cli version
          test "$(docker run --rm dicom-test-generator:ci id -u)" != 0
          docker run --rm dicom-test-generator:ci python -m app.cli exam --emergency \
            --patient-id DOCKER0001 --patient-name "DOCKER^TEST" -s 1 -i 2 --json > exam.json
          python3 -c 'import json; d = json.load(open("exam.json")); assert len(d["files"]) == 2, d'

      - name: CLI writes to a mounted folder as the host user
        run: |
          set -eu
          out="$RUNNER_TEMP/dtg-output"
          mkdir -p "$out"
          docker run --rm --user "$(id -u):$(id -g)" -v "$out:/app/output" dicom-test-generator:ci \
            python -m app.cli quick -p P000001 -m ct_generic -s 1 -i 3 -o /app/output
          test "$(find "$out" -name '*.dcm' -user "$(id -u)" | wc -l)" = 3

      - name: Web UI listens on 0.0.0.0 and requires HTTP Basic
        run: |
          set -eu
          work="$RUNNER_TEMP/dtg"
          mkdir -p "$work"
          head -c 24 /dev/urandom | base64 | tr -d '/+=\n' > "$work/password"
          echo "::add-mask::$(cat "$work/password")"
          chmod 0644 "$work/password"

          # イメージの中の設定のまま起動する。パスワードのファイルが無ければ起動しない（終了コード 2）
          status=0
          docker run --rm dicom-test-generator:ci || status=$?
          test "$status" = 2

          docker run -d --name dtg -p 127.0.0.1:18080:8080 \
            -v "$work/password:/run/secrets/dtg_web_password:ro" \
            -e DTG_WEB_PASSWORD_FILE=/run/secrets/dtg_web_password \
            dicom-test-generator:ci
          code=000
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/worklist || true)"
            [ "$code" != 000 ] && break
            sleep 1
          done
          echo "without credentials: $code"
          test "$code" = 401
          code="$(curl -s -o /dev/null -w '%{http_code}' -u "dtg:$(cat "$work/password")" http://127.0.0.1:18080/worklist)"
          echo "with credentials: $code"
          test "$code" = 200

      - name: Container log
        if: always()
        run: docker logs dtg || true
