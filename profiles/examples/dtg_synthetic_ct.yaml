schema_version: 1
name: "dtg_synthetic_ct"
description: "架空の CT（装置のプロファイルの仕組みの例）"

source:
  title: ""
  version: ""
  date: ""
  url: ""
  document_id: ""
  notes: "架空。実在の装置のコンフォーマンスステートメントの写しではない"

device:
