# 肝臓 ダイナミック。画像数は 撮影範囲 ÷ スライス厚 の計算（範囲は肝臓 250mm・体の前後
# 250mm の想定。ADR-0025）
name: "ct_liver_dynamic"
label: "肝臓 ダイナミック"
modality: "CT"
protocol_name: "LIVER DYNAMIC"
keywords: ["ダイナミック", "肝臓", "肝", "LIVER"]
# Body Part Examined（PS3.16 Annex L。対にならない部位。ADR-0037）。肝臓の語（LIVER）もある
# が、撮影の範囲が腹部全体なので ABDOMEN にする
body_part: "ABDOMEN"
# 図形の方式（phantom）の部位の図形と、造影の相（docs/spec/06 の 4.6）
phantom: "abdomen"
series:
  - kind: "localizer"
    description: "Scout"
    images: 1
    views: ["frontal"]
  - kind: "axial"
    description: "AX 5mm"
    images: 50
    slice_thickness: 5.0
  - kind: "axial"
    description: "Arterial 3mm"
    images: 83
    slice_thickness: 3.0
    contrast: true
    phase: "arterial"
  - kind: "axial"
    description: "Portal 3mm"
    images: 83
    slice_thickness: 3.0
    contrast: true
    phase: "portal"
  - kind: "axial"
    description: "Delayed 3mm"
    images: 83
    slice_thickness: 3.0
    contrast: true
    phase: "delayed"
  - kind: "coronal"
    description: "COR Portal 3mm"
    images: 83
    slice_thickness: 3.0
    contrast: true
    phase: "portal"
  - kind: "dose_report"
    description: "Dose Report"
    images: 1
