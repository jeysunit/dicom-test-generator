    images: 25
    plane: "axial"
    slice_thickness: 5.0
    spacing: 1.0
    sequence: "EP"
  - kind: "derived"
    description: "ADC"
    images: 25
    plane: "axial"
    slice_thickness: 5.0
    spacing: 1.0
    sequence: "EP"
  - kind: "acquisition"
    description: "T2*"
    images: 25
    plane: "axial"
    slice_thickness: 5.0
    spacing: 1.0
    sequence: "GR"
  - kind: "acquisition"
    description: "T1 SAG"
    images: 25
    plane: "sagittal"
    slice_thickness: 5.0
    spacing: 1.0
  - kind: "acquisition"
    description: "T2 AX"
    images: 25
    plane: "axial"
    slice_thickness: 5.0
    spacing: 1.0
  - kind: "acquisition"
    description: "FLAIR"
    images: 25
    plane: "axial"
    slice_thickness: 5.0
