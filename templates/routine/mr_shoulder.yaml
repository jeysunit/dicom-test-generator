# MR 肩。画像数は 撮影範囲 ÷（厚さ＋間隔）の計算（3mm／0.3mm。範囲は 80mm の想定。
# ADR-0025）
name: "mr_shoulder"
label: "肩"
modality: "MR"
protocol_name: "SHOULDER"
keywords: ["肩", "SHOULDER"]
# Body Part Examined。対になる部位（Table L-5）なので General Series の Laterality (0020,0060)
# が要る。左右は架空の R（予約の記述からは読み取らない。ADR-0034・ADR-0037）
body_part: "SHOULDER"
laterality: "R"
# 図形の方式（phantom）の部位の図形と、シリーズの強調（docs/spec/06 の 4.6）
phantom: "limb"
series:
  - kind: "localizer"
    description: "Localizer"
    images: 15
    plane: "three_plane"
    slice_thickness: 8.0
    sequence: "GR"
  - kind: "acquisition"
    description: "T2 FS AX"
    images: 24
    plane: "axial"
    slice_thickness: 3.0
    spacing: 0.3
    weighting: "T2"
  - kind: "acquisition"
    description: "T2 FS COR"
    images: 24
    plane: "coronal"
    slice_thickness: 3.0
    spacing: 0.3
    weighting: "T2"
  - kind: "acquisition"
    description: "T1 COR"
    images: 24
    plane: "coronal"
    slice_thickness: 3.0
    spacing: 0.3
    weighting: "T1"
  - kind: "acquisition"
    description: "T1 SAG"
    images: 24
    plane: "sagittal"
    slice_thickness: 3.0
    spacing: 0.3
    weighting: "T1"
